name: back-aurum · CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────────────────
  # 1. Lint + Type-check
  # ─────────────────────────────────────────────────────────
  lint-typecheck:
    name: Lint & tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────
  # 2. Unit + Integration tests (Jest)
  # ─────────────────────────────────────────────────────────
  unit-tests:
    name: Jest (unit + integration)
    runs-on: ubuntu-latest
    needs: lint-typecheck

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aurum
          POSTGRES_PASSWORD: aurum_test
          POSTGRES_DB: aurum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma migrations (test DB)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://aurum:aurum_test@localhost:5432/aurum_test
          DIRECT_URL: postgresql://aurum:aurum_test@localhost:5432/aurum_test

      - name: Run Jest
        run: npm run test:cov -- --ci --passWithNoTests
        env:
          DATABASE_URL: postgresql://aurum:aurum_test@localhost:5432/aurum_test
          DIRECT_URL: postgresql://aurum:aurum_test@localhost:5432/aurum_test
          JWT_SECRET: ci-test-secret-not-for-production
          NODE_ENV: test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  # 3. Deploy → EC2 via SSH (main only)
  #    NOTE: E2E Playwright tests live in aurum's workflow.
  #    This job triggers after aurum's pipeline succeeds,
  #    or can be triggered standalone for backend-only changes.
  # ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy → EC2
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ec2-user/back-aurum

            echo "── Pulling latest code ──"
            git pull origin main

            echo "── Aggressive pre-build prune ──"
            # Attempt to free up as much SSD and RAM as possible on our t2.micro
            docker image prune -af || true

            echo "── Rebuilding backend container ──"
            docker compose -f docker-compose.prod.yml up -d --build --no-deps backend

            echo "── Health Check (Waiting 10s) ──"
            sleep 10
            if ! docker ps --filter "name=back-aurum-prod" --filter "status=running" | grep -q back-aurum-prod; then
              echo "CRITICAL ERROR: Container is not running!"
              docker logs back-aurum-prod --tail 50
              exit 1
            fi
            echo "Container is running properly!"

            echo "── Running Prisma migrations ──"
            docker compose -f docker-compose.prod.yml exec -T backend \
              npx prisma migrate deploy

            echo "── Pruning dangling images ──"
            docker image prune -f

            echo "── Deploy complete ✓ ──"
