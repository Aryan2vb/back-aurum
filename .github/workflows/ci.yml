name: back-aurum · CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────────────────
  # 1. Lint + Type-check
  # ─────────────────────────────────────────────────────────
  lint-typecheck:
    name: Lint & tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint "{src,apps,libs}/**/*.ts"

      - name: TypeScript check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────
  # 2. Unit + Integration tests (Jest)
  # ─────────────────────────────────────────────────────────
  unit-tests:
    name: Jest (unit + integration)
    runs-on: ubuntu-latest
    needs: lint-typecheck

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aurum
          POSTGRES_PASSWORD: aurum_test
          POSTGRES_DB: aurum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma migrations (test DB)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://aurum:aurum_test@localhost:5432/aurum_test
          DIRECT_URL: postgresql://aurum:aurum_test@localhost:5432/aurum_test

      - name: Run Jest
        run: npm run test:cov -- --ci --passWithNoTests
        env:
          DATABASE_URL: postgresql://aurum:aurum_test@localhost:5432/aurum_test
          DIRECT_URL: postgresql://aurum:aurum_test@localhost:5432/aurum_test
          JWT_SECRET: ci-test-secret-not-for-production
          NODE_ENV: test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage/
          retention-days: 7

