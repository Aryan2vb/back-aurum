version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: back-aurum-prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    # Limit backend container to 800MB RAM to prevent t2.micro OS from crashing
    deploy:
      resources:
        limits:
          memory: 800M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
